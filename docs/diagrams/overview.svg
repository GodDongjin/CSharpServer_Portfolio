<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1905" viewBox="0 0 1000 1905" role="img" aria-labelledby="title desc">
<title id="title">서버 전체 구성</title>
<desc id="desc">15개 구성 요소와 18개 관계를 유지한다. GameSession과 Session은 S1 경계 안의 같은 객체다. S1 참조 표식은 새 객체가 아니다. A 원형 표식 둘은 같은 TCP 연결의 양 끝을 연결한다.</desc>
