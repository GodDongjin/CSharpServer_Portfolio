<svg xmlns="http://www.w3.org/2000/svg" width="840" height="2070" viewBox="0 0 840 2070" role="img" aria-labelledby="title desc">
<title id="title">서버 전체 구성</title>
<desc id="desc">연결과 세션, 패킷과 게임 로직, DB 작업과 저장소 순서로 배치한 전체 구성도. 기존의 15개 구성 요소와 18개 연결 관계를 유지한다. Session 참조는 같은 객체를 가리킨다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#697580"/></marker></defs>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#30363d}
.section{font-size:21px;font-weight:700}.name{font-size:19px;font-weight:600}.body{font-size:18px}.edge-label{font-size:17px}.badge{font-size:15px;fill:#57636f}.edge{fill:none;stroke:#7f8993;stroke-width:1.25;stroke-linejoin:round}.node{fill:#fff;stroke:#9aa2aa;stroke-width:1}.panel{fill:#f8f9fa;stroke:#d0d5da;stroke-width:1}
</style>
<rect width="840" height="2070" fill="#fff"/>
