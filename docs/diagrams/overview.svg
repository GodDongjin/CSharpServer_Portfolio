<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1420" viewBox="0 0 1280 1420" role="img" aria-labelledby="title desc">
<title id="title">서버 구조도</title>
<desc id="desc">클라이언트와 외부 저장소, 단일 GameServer 프로세스를 보여주는 구조도. 프로세스 안에서 GameServer 프로젝트는 게임 기능을 담당하고 ServerCore 라이브러리를 참조한다. ServerCore는 TCP 네트워크, 세션과 연결 관리, MySQL 작업 실행, Redis 연결 기반을 제공한다. GameSession은 Session을 상속한다. 외부 저장소는 사용자와 Hero를 보관하는 MySQL과 매칭 티켓을 보관하는 Redis다. 화살표는 프로젝트 의존, 양방향 선은 외부 통신을 뜻한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#354c60"/></marker></defs>
