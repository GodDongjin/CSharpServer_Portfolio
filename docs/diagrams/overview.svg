<text x="56" y="252" class="badge" text-anchor="start"><tspan x="56" dy="0">ServerCore 중심 · GameSession은 Session을 상속한 같은 객체</tspan></text>
<rect class="panel" x="32" y="865" width="776" height="717" rx="8"/>
<text x="56" y="898" class="section" text-anchor="start"><tspan x="56" dy="0">02  패킷과 게임 로직</tspan></text>
<text x="56" y="925" class="badge" text-anchor="start"><tspan x="56" dy="0">GameServer · 수신 큐에서 게임 로직 실행</tspan></text>
<rect class="panel" x="32" y="1622" width="776" height="410" rx="8"/>
