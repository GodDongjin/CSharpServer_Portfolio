<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1460" viewBox="0 0 1000 1460" role="img" aria-labelledby="title desc">
<title id="title">서버 전체 구성과 요청 처리 흐름</title>
<desc id="desc">접속 준비와 일반 요청 처리를 분리한 흐름도. 일반 요청은 수신과 패킷 조립, 파싱, 세션 작업 큐, 게임 로직, 응답 송신 순서로 진행된다. 게임 로직은 로그인, Hero, 매칭으로 분기한다. 실선은 처리 진행, 점선은 결과가 응답으로 이어지는 흐름이다. 상자는 처리 단계이며 GameSession은 Session을 상속한 하나의 연결 객체다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758a"/></marker>
</defs>
<style>
text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; fill: #203449; }
.title { font-size: 29px; font-weight: 700; }
.section { font-size: 23px; font-weight: 700; }
.name { font-size: 21px; font-weight: 700; }
.body { font-size: 19px; }
.small { font-size: 17px; fill: #536779; }
.num { font-size: 21px; font-weight: 700; fill: #fff; }
.edge { fill: none; stroke: #60758a; stroke-width: 2; stroke-linejoin: round; }
.result { stroke-dasharray: 6 5; }
</style>
<rect width="1000" height="1460" rx="16" fill="#ffffff"/>

<text x="36" y="44" class="title" text-anchor="start"><tspan x="36" dy="0">서버 처리 흐름</tspan></text>
<text x="36" y="76" class="body" text-anchor="start"><tspan x="36" dy="0">상자는 처리 단계입니다. 화살표를 따라 접속 준비와 요청 처리를 읽습니다.</tspan></text>
<rect x="24" y="102" width="952" height="128" rx="12" fill="#f4f7fa" stroke="#e2e8ef"/>
<text x="42" y="132" class="section" text-anchor="start"><tspan x="42" dy="0">01  접속 준비</tspan></text>
<text x="255" y="132" class="small" text-anchor="start"><tspan x="255" dy="0">Program이 DB·Redis, 서비스, 패킷 처리기와 풀을 먼저 준비</tspan></text>
<rect x="42" y="150" width="199" height="62" rx="10" fill="#fff" stroke="#c8d4df"/>
<text x="141.5" y="175" class="name" text-anchor="middle"><tspan x="141.5" dy="0">클라이언트</tspan></text>
<text x="141.5" y="200" class="small" text-anchor="middle"><tspan x="141.5" dy="0">TCP 접속</tspan></text>
<path data-from="connection0" data-to="connection1" class="edge" d="M 241 181 H 273" marker-end="url(#arrow)"/>
<rect x="281" y="150" width="199" height="62" rx="10" fill="#fff" stroke="#c8d4df"/>
<text x="380.5" y="175" class="name" text-anchor="middle"><tspan x="380.5" dy="0">Service · Listen</tspan></text>
<text x="380.5" y="200" class="small" text-anchor="middle"><tspan x="380.5" dy="0">연결 수락</tspan></text>
<path data-from="connection1" data-to="connection2" class="edge" d="M 480 181 H 512" marker-end="url(#arrow)"/>
<rect x="520" y="150" width="199" height="62" rx="10" fill="#fff" stroke="#c8d4df"/>
<text x="619.5" y="175" class="name" text-anchor="middle"><tspan x="619.5" dy="0">SessionManager</tspan></text>
<text x="619.5" y="200" class="small" text-anchor="middle"><tspan x="619.5" dy="0">풀에서 세션 할당</tspan></text>
<path data-from="connection2" data-to="connection3" class="edge" d="M 719 181 H 751" marker-end="url(#arrow)"/>
<rect x="759" y="150" width="199" height="62" rx="10" fill="#fff" stroke="#c8d4df"/>
<text x="858.5" y="175" class="small" text-anchor="middle"><tspan x="858.5" dy="0">GameSession : Session</tspan></text>
<text x="858.5" y="200" class="small" text-anchor="middle"><tspan x="858.5" dy="0">초기화 후 수신 시작</tspan></text>
<text x="36" y="272" class="section" text-anchor="start"><tspan x="36" dy="0">02  일반 요청 처리</tspan></text>
<text x="290" y="272" class="body" text-anchor="start"><tspan x="290" dy="0">위에서 아래로 진행 · ④에서 요청 종류에 따라 분기</tspan></text>
<g data-step="1">
<rect x="252" y="298" width="496" height="78" rx="10" fill="#fff" stroke="#c8d4df"/>
<circle cx="282" cy="328" r="17" fill="#315b83"/>
<text x="282" y="335" class="num" text-anchor="middle"><tspan x="282" dy="0">1</tspan></text>
<text x="312" y="330" class="name" text-anchor="start"><tspan x="312" dy="0">수신 · 패킷 조립</tspan></text>
<text x="312" y="358" class="body" text-anchor="start"><tspan x="312" dy="0">Session · TCP 바이트를 완성된 패킷으로</tspan></text>
</g>
<path data-from="1" data-to="2" class="edge" d="M 500 376 V 407" marker-end="url(#arrow)"/>
<g data-step="2">
<rect x="252" y="410" width="496" height="78" rx="10" fill="#fff" stroke="#c8d4df"/>
<circle cx="282" cy="440" r="17" fill="#315b83"/>
<text x="282" y="447" class="num" text-anchor="middle"><tspan x="282" dy="0">2</tspan></text>
<text x="312" y="442" class="name" text-anchor="start"><tspan x="312" dy="0">패킷 ID 확인 · Protobuf 파싱</tspan></text>
<text x="312" y="470" class="body" text-anchor="start"><tspan x="312" dy="0">GSPacketHandler</tspan></text>
</g>
<path data-from="2" data-to="3" class="edge" d="M 500 488 V 519" marker-end="url(#arrow)"/>
<g data-step="3">
<rect x="252" y="522" width="496" height="100" rx="10" fill="#eef4fd" stroke="#c8d4df"/>
<circle cx="282" cy="552" r="17" fill="#315b83"/>
<text x="282" y="559" class="num" text-anchor="middle"><tspan x="282" dy="0">3</tspan></text>
<text x="312" y="554" class="name" text-anchor="start"><tspan x="312" dy="0">세션별 작업 큐</tspan></text>
<text x="312" y="582" class="body" text-anchor="start"><tspan x="312" dy="0">Session.EnqueueAsyncJob</tspan></text>
<text x="312" y="607" class="small" text-anchor="start"><tspan x="312" dy="0">같은 연결의 작업을 순서대로 하나씩 await</tspan></text>
</g>
<path data-from="3" data-to="4" class="edge" d="M 500 622 V 653" marker-end="url(#arrow)"/>
<g data-step="4">
<rect x="252" y="656" width="496" height="78" rx="10" fill="#fff" stroke="#c8d4df"/>
<circle cx="282" cy="686" r="17" fill="#315b83"/>
<text x="282" y="693" class="num" text-anchor="middle"><tspan x="282" dy="0">4</tspan></text>
<text x="312" y="688" class="name" text-anchor="start"><tspan x="312" dy="0">게임 로직 실행</tspan></text>
<text x="312" y="716" class="body" text-anchor="start"><tspan x="312" dy="0">GSPacket · 요청에 맞는 핸들러 호출</tspan></text>
</g>
<path class="edge" d="M 500 734 V 758 H 188 M 500 758 H 812"/>
<path data-from="4" data-to="login" class="edge" d="M 188 758 V 787" marker-end="url(#arrow)"/>
<path data-from="4" data-to="hero" class="edge" d="M 500 758 V 787" marker-end="url(#arrow)"/>
<path data-from="4" data-to="match" class="edge" d="M 812 758 V 787" marker-end="url(#arrow)"/>
<g data-branch="login">
<rect x="36" y="790" width="304" height="160" rx="10" fill="#f3f7fb" stroke="#c8d4df"/>
<text x="188" y="823" class="name" text-anchor="middle"><tspan x="188" dy="0">로그인 · Hero 최초 로드</tspan></text>
<text x="188" y="862" class="small" text-anchor="middle"><tspan x="188" dy="0">LoginDB · HeroDB</tspan><tspan x="188" dy="29">→ DB Worker → MySQL</tspan><tspan x="188" dy="29">조회 결과를 연결 메모리에 보관</tspan></text>
</g>
<g data-branch="hero">
<rect x="348" y="790" width="304" height="160" rx="10" fill="#f3f7fb" stroke="#c8d4df"/>
<text x="500" y="823" class="name" text-anchor="middle"><tspan x="500" dy="0">Hero 조회 · 변경</tspan></text>
<text x="500" y="862" class="small" text-anchor="middle"><tspan x="500" dy="0">조회: HeroManager 메모리</tspan><tspan x="500" dy="29">변경: HeroDB → DB Worker</tspan><tspan x="500" dy="29">→ MySQL 커밋 → 연결 확인·반영</tspan></text>
</g>
<g data-branch="match">
<rect x="660" y="790" width="304" height="160" rx="10" fill="#f3f7fb" stroke="#c8d4df"/>
<text x="812" y="823" class="name" text-anchor="middle"><tspan x="812" dy="0">PvP 매칭</tspan></text>
<text x="812" y="862" class="small" text-anchor="middle"><tspan x="812" dy="0">MatchManager: 대기 · 방 상태</tspan><tspan x="812" dy="29">RedisMatchmakingStore → Redis</tspan><tspan x="812" dy="29">Redis에는 매칭 티켓 저장</tspan></text>
</g>
<path class="edge result" d="M 188 950 V 978 H 500 M 812 950 V 978 H 500 M 500 950 V 978"/>
<path data-from="results" data-to="5" class="edge result" d="M 500 978 V 1020" marker-end="url(#arrow)"/>
<text x="581" y="1009" class="small" text-anchor="start"><tspan x="581" dy="0">처리 결과 → 응답이 필요한 경우</tspan></text>
<g data-step="5">
<rect x="252" y="1024" width="496" height="100" rx="10" fill="#fff" stroke="#c8d4df"/>
<circle cx="282" cy="1054" r="17" fill="#315b83"/>
<text x="282" y="1061" class="num" text-anchor="middle"><tspan x="282" dy="0">5</tspan></text>
<text x="312" y="1056" class="name" text-anchor="start"><tspan x="312" dy="0">응답 등록 · 송신</tspan></text>
<text x="312" y="1084" class="body" text-anchor="start"><tspan x="312" dy="0">GSPacket → Session.SendPacket</tspan></text>
<text x="312" y="1109" class="small" text-anchor="start"><tspan x="312" dy="0">직렬화 · SendAsync · 부분 송신 이어 보내기</tspan></text>
</g>
<path data-from="5" data-to="client-response" class="edge" d="M 500 1124 V 1159" marker-end="url(#arrow)"/>
<rect x="337" y="1163" width="326" height="53" rx="26" fill="#eef4fd" stroke="#c8d4df"/>
<text x="500" y="1196" class="name" text-anchor="middle"><tspan x="500" dy="0">클라이언트가 응답 수신</tspan></text>
<text x="500" y="1247" class="small" text-anchor="middle"><tspan x="500" dy="0">①·③·⑤는 같은 GameSession 객체가 상속한 Session 기능입니다.</tspan></text>
<rect x="24" y="1274" width="952" height="161" rx="12" fill="#f4f7fa" stroke="#e2e8ef"/>
<text x="42" y="1307" class="section" text-anchor="start"><tspan x="42" dy="0">03  연결 감시와 세션 반환</tspan></text>
<text x="42" y="1343" class="name" text-anchor="start"><tspan x="42" dy="0">연결 감시</tspan></text>
<text x="42" y="1373" class="small" text-anchor="start"><tspan x="42" dy="0">SocketHeartBeat · 로그인 / Ping·Pong 제한</tspan><tspan x="42" dy="27">Pong은 ②에서 확인하고 게임 큐를 건너뜁니다.</tspan></text>
<path d="M 487 1331 V 1413" stroke="#d3dde7"/>
<text x="516" y="1343" class="name" text-anchor="start"><tspan x="516" dy="0">세션 반환</tspan></text>
<text x="516" y="1373" class="small" text-anchor="start"><tspan x="516" dy="0">연결 종료 → 진행 중 I/O·작업 완료 → 반환 큐</tspan><tspan x="516" dy="27">초기화 · 자원 정리 → 다음 연결에서 재사용</tspan></text>
</svg>
