services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: demo-root-local-only
      MYSQL_DATABASE: csharp_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo-local-only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - demo_mysql:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:6380:6379"
volumes:
  demo_mysql:
