syntax = "proto3";
package Protocol;

option csharp_namespace = "CSharp.Protocol";

enum LOGIN_ERROR
{
	LOGIN_NONE = 0;
	LOGIN_SUCCESS = 1;
	LOGIN_FAIL = 2;
}

enum RESULT_CODE
{
	RESULT_CODE_NONE = 0;
	RESULT_CODE_OK = 1;
	RESULT_CODE_INVALID_REQUEST = 2;
	RESULT_CODE_NOT_LOGGED_IN = 3;
	RESULT_CODE_NOT_FOUND = 4;
	RESULT_CODE_BUSY = 5;
	RESULT_CODE_STORAGE_ERROR = 6;
	RESULT_CODE_DISCONNECTED = 7;
}

enum HERO_FIELD
{
	HERO_FIELD_NONE = 0;
	HERO_FIELD_PINNED = 1;
	HERO_FIELD_LOCKED = 2;
}

enum MATCH_STATE
{
	MATCH_STATE_IDLE = 0;
	MATCH_STATE_PENDING = 1;
	MATCH_STATE_MATCHED = 2;
	MATCH_STATE_CLOSED = 3;
}
